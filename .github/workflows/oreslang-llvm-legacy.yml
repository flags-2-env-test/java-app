name: Oreslang LLVM legacy actor regression (exact blobs)
on:
  push:
    branches: [ci/oreslang-llvm-legacy-20261012]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned source blobs
        run: |
          cd verification/oreslang-llvm-legacy
          while read -r expected path; do
            actual="$(git hash-object "$path")"
            if [ "$expected" != "$actual" ]; then
              echo "::error::source SHA mismatch in $path"
              exit 1
            fi
          done < exact-source-blobs.txt
      - name: Install native LLVM tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake llvm-dev python3
      - name: Compile real LLVM frontend
        run: cmake -S verification/oreslang-llvm-legacy -B build-llvm-legacy -DCMAKE_BUILD_TYPE=Debug && cmake --build build-llvm-legacy --parallel 2
      - name: Run original-intent canonical regression suite
        run: ctest --test-dir build-llvm-legacy --output-on-failure -j 2
